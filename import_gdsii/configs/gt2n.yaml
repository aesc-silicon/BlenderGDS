# Georgia Tech GT2N: drawing datatypes only, dimensions in micrometers.
# Source: https://github.com/azadnaeemi/GT2N
# Revision: fe179cb2aa424f93a2199a78bbbbed26c738f79c
# Layer map: techlib/gt2_techfile.layermap
# Frontside gate/metal elevations: qrc/GT2.ict
# Contact/BPR thicknesses and backside pitches: nxtgrd/GT2.itf
#
# Visualization assumptions: z=0 is the top of the buried oxide. ACT is
# expanded to three 5 nm sheets with 10 nm gaps, starting at z=0.020.
# SDCON spans 18–75 nm, extending 2 nm below ACT1 as a visualization
# assumption (overriding the ITF contact thickness). VBPR ends at SDCON's base.
# VSD/VG bridge to M0. BPR sits below 23 nm BOX.
# Wells, selection/threshold masks and cuts are references, not physical solids.
# These are schematic rectangular volumes; oxide/spacers and source/drain
# epitaxy are not reconstructed. This is not a fabrication cross-section.

