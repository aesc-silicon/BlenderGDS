[tox]
env_list = lint
minversion = v4.0
skipsdist = True

[testenv:lint]
description = run linters
skip_install = true
deps =
    -r requirements-lint.txt
commands =
  yamllint -s import_gdsii/configs/
  python3 scripts/internal/check_configs.py
  flake8 import_gdsii/__init__.py scripts/build_extension.py
  pylint import_gdsii/__init__.py scripts/build_extension.py

[flake8]
max-line-length = 100
# Blender declares the properties of an operator as annotations, which pyflakes
# reads as type annotations of an undefined type
extend-ignore = F722, F821
# bl_info has to be readable before the add-on imports anything
per-file-ignores = import_gdsii/__init__.py: E402

[pylint]
max-line-length = 100
# The extension runs inside Blender, its modules are not installed for linting
disable = import-error
